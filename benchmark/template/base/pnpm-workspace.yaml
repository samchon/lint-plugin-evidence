# ---------------------------------------------------------------------------
# Workspace packages
# ---------------------------------------------------------------------------
packages:
  - config
  - packages/api
  - packages/backend
  - packages/frontend

# ---------------------------------------------------------------------------
# Resolution invariants
# ---------------------------------------------------------------------------
# The `ttsc` family and `typia` must each resolve to exactly one instance
# across the workspace, and a declared range does not guarantee that.
#
# `@ttsc/factory` keeps its synthetic comment tables in module-level stores, so
# a node whose comments one instance recorded is comment-free to every other
# instance. Nestia depends on a factory range that cannot admit a newer minor,
# so raising the `ttsc` catalog alone silently splits the store and drops every
# generated controller's JSDoc WITHOUT failing a compile. The published API
# documentation simply arrives empty.
#
# `typia` has the same shape for a different reason: its transformer and its
# interface package must agree, and a split resolves validators against one
# version while the types come from another.
#
# These overrides state the single-instance requirement directly instead of
# leaving it to two declared ranges happening to overlap.
overrides:
  "@ttsc/factory": "catalog:typescript"
  "@typia/interface": "catalog:typescript"
  "@typia/utils": "catalog:typescript"

# ---------------------------------------------------------------------------
# Dependency catalogs
# ---------------------------------------------------------------------------
# Each family carries one version through a YAML anchor, so a bump is atomic
# and a sibling cannot be left behind.
catalogs:
  # TypeScript compiler, transformer, and the ttsc lint stack.
  typescript:
    ttsc: &ttsc "{{version:ttsc}}"
    "@ttsc/unplugin": *ttsc
    "@ttsc/factory": *ttsc
    "@ttsc/lint": *ttsc
    typescript: "{{version:typescript}}"
    typia: &typia "{{version:typia}}"
    "@typia/interface": *typia
    "@typia/utils": *typia
    rimraf: "{{version:rimraf}}"

  # Backend runtime: NestJS, Nestia, Prisma, and the server toolchain.
  backend:
    "@nestia/core": &nestia "{{version:nestia}}"
    "@nestia/sdk": *nestia
    "@nestia/fetcher": *nestia
    "@nestia/e2e": *nestia
    "@nestjs/common": &nestjs "{{version:nestjs}}"
    "@nestjs/core": *nestjs
    "@nestjs/platform-fastify": *nestjs
    prisma: &prisma "{{version:prisma}}"
    "@prisma/client": *prisma
    "@prisma/adapter-better-sqlite3": *prisma
    better-sqlite3: "{{version:betterSqlite3}}"
    prisma-markdown: "{{version:prismaMarkdown}}"
    tstl: "{{version:tstl}}"
    dotenv: "{{version:dotenv}}"
    dotenv-expand: "{{version:dotenvExpand}}"
    uuid: "{{version:uuid}}"
    jsonwebtoken: "{{version:jsonwebtoken}}"
    bcryptjs: "{{version:bcryptjs}}"
    source-map-support: "{{version:sourceMapSupport}}"
    "@types/node": "{{version:nodeTypes}}"
    "@types/jsonwebtoken": "{{version:jsonwebtokenTypes}}"

  # Frontend runtime and the Vite toolchain.
  frontend:
    react: &react "{{version:react}}"
    react-dom: *react
    react-router-dom: "{{version:reactRouter}}"
    "@types/react": &reactTypes "{{version:reactTypes}}"
    "@types/react-dom": *reactTypes
    "@tanstack/react-query": "{{version:reactQuery}}"
    vite: "{{version:vite}}"
    "@vitejs/plugin-react": "{{version:viteReact}}"
    tailwindcss: "{{version:tailwind}}"
    postcss: "{{version:postcss}}"
    autoprefixer: "{{version:autoprefixer}}"
    "@playwright/test": "{{version:playwright}}"
