<text x="1404" y="339" text-anchor="end" class="value" fill="#f58518">100.0%</text>
<text x="36" y="386" class="table-note">Coverage measured by Claude Code Opus 5 — thirteen graph edges read from the source, composed so serial hops multiply and branches average. Evidence is 100% by construction: a cell that misses an edge does not compile.</text>
