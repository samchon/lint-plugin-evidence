<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1440 560" width="1440" height="560">
<title id="title">Todo: Plain against Evidence on four axes</title>
<desc id="description">One subject, one model, one instruction sequence. Tokens, work time and API cost are lower-is-better; requirement coverage is higher-is-better. Each panel is scaled within itself because the four axes share no unit.</desc>
<style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
  .title { font-size: 27px; font-weight: 700; }
  .subtitle, .generated { font-size: 13px; fill: #667085; }
  .panel-title { font-size: 17px; font-weight: 700; }
  .panel-unit { font-size: 12px; fill: #667085; }
  .value { font-size: 19px; font-weight: 700; }
  .arm { font-size: 13px; font-weight: 600; fill: #526b82; }
  .delta { font-size: 14px; font-weight: 700; }
  .legend { font-size: 12px; fill: #526b82; }
  .baseline { stroke: #d5dee9; stroke-width: 1px; }
  .panel-bg { fill: #e8f2fb; fill-opacity: 0.5; }
  .table-title { font-size: 15px; font-weight: 600; }
  .table-header { font-size: 11px; font-weight: 600; fill: #667085; }
  .table-cell { font-size: 12px; fill: #334155; }
  .table-rule { stroke: #dbe4ee; stroke-width: 1px; }
  .table-note { font-size: 11px; fill: #667085; }
</style>
<rect width="1440" height="560" fill="#ffffff"/>

<text x="36" y="38" class="title">Todo: Plain against Evidence</text>
<text x="36" y="62" class="subtitle">One subject, one model, one instruction sequence. The Evidence arm adds a compiler-enforced provenance graph — it spends less on every axis and covers more.</text>

<rect x="36" y="80" width="18" height="12" rx="3" fill="#4c78a8"/>
<text x="61" y="91" class="legend">Plain</text>
<rect x="120" y="80" width="18" height="12" rx="3" fill="#f58518"/>
<text x="145" y="91" class="legend">Evidence</text>

<!-- ═══ Tokens ═══════════════════════════════════════════════ -->
<rect x="36" y="112" width="300" height="330" rx="10" class="panel-bg"/>
<text x="186" y="140" text-anchor="middle" class="panel-title">Tokens</text>
<text x="186" y="158" text-anchor="middle" class="panel-unit">lower is better</text>
<line x1="60" y1="400" x2="312" y2="400" class="baseline"/>
<rect x="86"  y="160" width="80" height="240" rx="4" fill="#4c78a8"/>
<rect x="206" y="343" width="80" height="57"  rx="4" fill="#f58518"/>
<text x="126" y="152" text-anchor="middle" class="value" fill="#4c78a8">550M</text>
<text x="246" y="335" text-anchor="middle" class="value" fill="#f58518">130M</text>
<text x="126" y="420" text-anchor="middle" class="arm">Plain</text>
<text x="246" y="420" text-anchor="middle" class="arm">Evidence</text>
<text x="186" y="444" text-anchor="middle" class="delta" fill="#f58518">4.2× fewer</text>

<!-- ═══ Work time ════════════════════════════════════════════ -->
<rect x="396" y="112" width="300" height="330" rx="10" class="panel-bg"/>
<text x="546" y="140" text-anchor="middle" class="panel-title">Work time</text>
<text x="546" y="158" text-anchor="middle" class="panel-unit">lower is better</text>
<line x1="420" y1="400" x2="672" y2="400" class="baseline"/>
<rect x="446" y="160" width="80" height="240" rx="4" fill="#4c78a8"/>
<rect x="566" y="322" width="80" height="78"  rx="4" fill="#f58518"/>
<text x="486" y="152" text-anchor="middle" class="value" fill="#4c78a8">11h 38m</text>
<text x="606" y="314" text-anchor="middle" class="value" fill="#f58518">3h 47m</text>
<text x="486" y="420" text-anchor="middle" class="arm">Plain</text>
<text x="606" y="420" text-anchor="middle" class="arm">Evidence</text>
<text x="546" y="444" text-anchor="middle" class="delta" fill="#f58518">3.1× faster</text>

<!-- ═══ API cost ═════════════════════════════════════════════ -->
<rect x="756" y="112" width="300" height="330" rx="10" class="panel-bg"/>
<text x="906" y="140" text-anchor="middle" class="panel-title">API cost</text>
<text x="906" y="158" text-anchor="middle" class="panel-unit">lower is better</text>
<line x1="780" y1="400" x2="1032" y2="400" class="baseline"/>
<rect x="806" y="160" width="80" height="240" rx="4" fill="#4c78a8"/>
<rect x="926" y="344" width="80" height="56"  rx="4" fill="#f58518"/>
<text x="846" y="152" text-anchor="middle" class="value" fill="#4c78a8">$7.04</text>
<text x="966" y="336" text-anchor="middle" class="value" fill="#f58518">$1.64</text>
<text x="846" y="420" text-anchor="middle" class="arm">Plain</text>
<text x="966" y="420" text-anchor="middle" class="arm">Evidence</text>
<text x="906" y="444" text-anchor="middle" class="delta" fill="#f58518">4.3× cheaper</text>

<!-- ═══ Coverage ═════════════════════════════════════════════ -->
<rect x="1116" y="112" width="300" height="330" rx="10" class="panel-bg"/>
<text x="1266" y="140" text-anchor="middle" class="panel-title">Requirement coverage</text>
<text x="1266" y="158" text-anchor="middle" class="panel-unit">higher is better</text>
<line x1="1140" y1="400" x2="1392" y2="400" class="baseline"/>
<rect x="1166" y="208" width="80" height="192" rx="4" fill="#4c78a8"/>
<rect x="1286" y="160" width="80" height="240" rx="4" fill="#f58518"/>
<text x="1206" y="200" text-anchor="middle" class="value" fill="#4c78a8">80.1%</text>
<text x="1326" y="152" text-anchor="middle" class="value" fill="#f58518">100%</text>
<text x="1206" y="420" text-anchor="middle" class="arm">Plain</text>
<text x="1326" y="420" text-anchor="middle" class="arm">Evidence</text>
<text x="1266" y="444" text-anchor="middle" class="delta" fill="#f58518">+19.9 pt</text>

<!-- ═══ Detail ═══════════════════════════════════════════════ -->
<text x="36" y="482" class="table-title">Measured values</text>
<line x1="36" y1="494" x2="1404" y2="494" class="table-rule"/>
<text x="60" y="512" class="table-header">Arm</text>
<text x="360" y="512" text-anchor="end" class="table-header">Tokens</text>
<text x="560" y="512" text-anchor="end" class="table-header">Work time</text>
<text x="740" y="512" text-anchor="end" class="table-header">API cost</text>
<text x="960" y="512" text-anchor="end" class="table-header">Coverage</text>
<text x="1395" y="512" text-anchor="end" class="table-header">Stage</text>
<line x1="36" y1="520" x2="1404" y2="520" class="table-rule"/>
<text x="60" y="536" class="table-cell">Plain</text>
<text x="360" y="536" text-anchor="end" class="table-cell">549,955,449</text>
<text x="560" y="536" text-anchor="end" class="table-cell">11h 38m</text>
<text x="740" y="536" text-anchor="end" class="table-cell">$7.04</text>
<text x="960" y="536" text-anchor="end" class="table-cell">80.1%</text>
<text x="1395" y="536" text-anchor="end" class="table-cell">overall-final · completed</text>
<line x1="36" y1="543" x2="1404" y2="543" class="table-rule"/>
<text x="60" y="557" class="table-cell">Evidence</text>
<text x="360" y="557" text-anchor="end" class="table-cell">130,341,027</text>
<text x="560" y="557" text-anchor="end" class="table-cell">3h 47m</text>
<text x="740" y="557" text-anchor="end" class="table-cell">$1.64</text>
<text x="960" y="557" text-anchor="end" class="table-cell">100% by construction</text>
<text x="1395" y="557" text-anchor="end" class="table-cell">overall-final · completed</text>
</svg>
