packages:
  - "benchmark"
  - "config"
  - "packages/*"
  - "tests/*"
catalogs:
  prisma:
    # Pinned exactly: Prisma publishes this package under an engine-hash version
    # rather than a semver range, so a caret would express nothing. The bridge
    # prefers a copy resolvable from the consumer's own project and falls back
    # to this one, so the pin decides the default parser, not the only one.
    "@prisma/prisma-schema-wasm": 7.10.0-2.d0368e25c88e68caa4d283b5f2d88d1b76ed9356
  samchon:
    nestia: &nestia ^12.1.0
    "@nestia/core": *nestia
    "@nestia/e2e": *nestia
    "@nestia/fetcher": *nestia
    "@nestia/sdk": *nestia
    typia: &typia ^13.2.0
    "@typia/interface": *typia
    "@typia/utils": *typia
  typescript:
    typescript: ^7.0.2
    ttsc: &ttsc ^0.24.0
    "@ttsc/lint": *ttsc
    # Declared for the benchmark template, which consumes the Vite plugin this
    # repository does not. Its version follows `ttsc` because they ship as one.
    "@ttsc/unplugin": *ttsc
  utils:
    "@types/node": ^25.3.0
    rimraf: ^6.1.2
    yaml: ^2.9.0
