name: benchmark-runner

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmark/package.json"
      - "benchmark/template/**"
      - "benchmark/requirements/**"
      - "benchmark/src/**"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tests/test-benchmark/**"
  workflow_dispatch:

concurrency:
  group: benchmark-runner-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    name: Benchmark runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Test benchmark runner
        run: pnpm --filter test-benchmark start
