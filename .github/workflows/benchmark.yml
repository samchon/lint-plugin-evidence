name: benchmark-template

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmark/package.json"
      - "benchmark/template/**"
      - "benchmark/requirements/**"
      - "benchmark/src/**"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tests/test-benchmark/**"
  workflow_dispatch:

concurrency:
  group: benchmark-template-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template:
    name: Plain backend template (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore ttsc plugin cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/evidence/src/**', 'packages/evidence/native/**') }}

      - name: Check benchmark template test
        run: pnpm --filter test-benchmark check

      - name: Test Plain backend template
        run: pnpm --filter test-benchmark start
